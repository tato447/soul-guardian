<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心灵守护神 (调试版)</title>
    <style>
        /* 基础样式保持不变，只为了排查问题 */
        :root { --primary-color: #7d5fff; --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); --glass-bg: rgba(255, 255, 255, 0.95); }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-gradient); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; padding: 20px; color: #333; }
        
        .container { 
            background: var(--glass-bg); 
            border-radius: 24px; 
            padding: 30px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            position: relative; 
            min-height: 500px; 
            display: flex; 
            flex-direction: column; 
        }

        /* 调试标签 - 如果看不到这个，说明缓存没更新 */
        .debug-badge {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #ff4757;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 顶部错误条 - 如果代码出错会显示 */
        #error-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #ffa502;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            z-index: 10001;
            display: none;
        }

        h1 { font-size: 22px; text-align: center; margin: 0 0 5px 0; color: #333; }
        p.subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
        
        .step-content { display: none; flex: 1; flex-direction: column; animation: fadeIn 0.3s ease; }
        .step-content.active { display: flex; }
        
        label { font-weight: bold; margin-bottom: 15px; display: block; color: #444; }
        textarea, input { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; background: #fff; }
        textarea { height: 120px; resize: none; }
        
        .btn-group { margin-top: auto; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 50px; background: var(--primary-color); color: white; font-size: 16px; font-weight: bold; }
        .btn-secondary { background: #f1f2f6; color: #333; }
        
        /* 强制显示 */
        .loading-mask, #result-area { display: none; position: absolute; inset: 0; background: rgba(255,255,255,0.98); border-radius: 24px; flex-direction: column; justify-content: center; align-items: center; z-index: 900; }
        .guardian-img { width: 100%; border-radius: 12px; display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script>
        // 🚨 全局错误捕获器：只要代码有错，立刻在屏幕顶端显示
        window.onerror = function(msg, url, line) {
            const bar = document.getElementById('error-bar');
            bar.style.display = 'block';
            bar.innerHTML = "⚠️ 代码运行出错: " + msg + " (行号:" + line + ")";
            return false;
        };
    </script>
</head>
<body>
    <div class="debug-badge">Debug: v3.0</div>
    <div id="error-bar"></div>

    <div class="container">
        <div id="input-view" style="flex:1; display:flex; flex-direction:column;">
            <h1>🔮 心灵守护神</h1>
            <p class="subtitle">调试模式：如果不跳转请截图给我</p>

            <div class="step-content active" id="step1">
                <label>1/4. 请描述一个最近发生的、具体的、让你情绪波动的事件？</label>
                <textarea id="q1" placeholder="在这里输入..."></textarea>
                <div class="btn-group">
                    <button class="btn" onclick="tryNext(2)">下一步</button>
                </div>
            </div>

            <div class="step-content" id="step2">
                <label>2/4. 回到那个场景，你心里最强烈的那个感觉是什么？</label>
                <input type="text" id="q2">
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="tryPrev(1)">上一步</button>
                    <button class="btn" onclick="tryNext(3)">下一步</button>
                </div>
            </div>

            <div class="step-content" id="step3">
                <label>3/4. 当时你脑子里闪过的第一个念头是什么？</label>
                <input type="text" id="q3">
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="tryPrev(2)">上一步</button>
                    <button class="btn" onclick="tryNext(4)">下一步</button>
                </div>
            </div>

            <div class="step-content" id="step4">
                <label>4/4. 针对这件事情，你现在最想做的是什么？</label>
                <input type="text" id="q4">
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="tryPrev(3)">上一步</button>
                    <button class="btn" onclick="submitFlow()">✨ 开始显化</button>
                </div>
            </div>
        </div>

        <div class="loading-mask" id="loading-view" style="display:none;">
            <p>正在连接潜意识...</p>
        </div>

        <div id="result-area">
            <h2>你的守护神已降临</h2>
            <img id="final-image" class="guardian-img" src="">
            <button class="btn btn-secondary" onclick="location.reload()" style="margin-top:20px;">再试一次</button>
        </div>
    </div>

    <script>
        // 页面加载完成后，测试 JS 是否运行
        window.onload = function() {
            console.log("JS Loaded");
            // 注意：如果你不想每次刷新都弹窗，可以把下面这行注释掉，但第一次调试建议保留
            // alert("✅ 系统已就绪！如果看到这个，说明代码没问题。");
        }

        let currentStep = 1;

        function tryNext(target) {
            const inputId = 'q' + currentStep;
            const el = document.getElementById(inputId);
            
            // 简单粗暴的调试反馈
            if (!el) {
                alert("❌ 严重错误：找不到输入框 " + inputId);
                return;
            }

            if (!el.value.trim()) {
                alert("👉 请先填写内容才能下一步哦");
                return;
            }

            // 切换逻辑
            document.getElementById('step' + currentStep).classList.remove('active');
            document.getElementById('step' + target + '').classList.add('active');
            currentStep = target;
        }

        function tryPrev(target) {
            document.getElementById('step' + currentStep).classList.remove('active');
            document.getElementById('step' + target).classList.add('active');
            currentStep = target;
        }

        async function submitFlow() {
            const el = document.getElementById('q4');
            if (!el.value.trim()) { alert("请填写最后一步"); return; }

            // 隐藏输入，显示 Loading
            document.getElementById('loading-view').style.display = 'flex';

            try {
                const response = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Q1: document.getElementById('q1').value,
                        Q2: document.getElementById('q2').value,
                        Q3: document.getElementById('q3').value,
                        Q4: document.getElementById('q4').value
                    })
                });
                
                const resJson = await response.json();
                
                // 数据解析
                let imgUrl = "";
                try {
                    // 兼容各种奇怪的数据格式
                    let data = resJson.data;
                    if (typeof data === 'string') data = JSON.parse(data);
                    
                    if (data.output && data.output.url) imgUrl = data.output.url;
                    else if (typeof data.output === 'string') imgUrl = data.output;
                    else if (data.image && data.image.url) imgUrl = data.image.url;
                    
                    if (!imgUrl) throw new Error("无法解析图片地址");
                } catch (e) {
                    throw new Error("数据解析失败: " + e.message);
                }

                document.getElementById('final-image').src = imgUrl;
                document.getElementById('final-image').onload = function() {
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('input-view').style.display = 'none';
                    document.getElementById('result-area').style.display = 'flex';
                }

            } catch (error) {
                document.getElementById('loading-view').style.display = 'none';
                alert("❌ 生成失败: " + error.message);
            }
        }
    </script>
</body>
</html>
