<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心灵守护神</title>
    <style>
        :root { --primary-color: #7d5fff; --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); --glass-bg: rgba(255, 255, 255, 0.8); }
        body { font-family: 'PingFang SC', sans-serif; background: var(--bg-gradient); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; padding: 20px; color: #333; overflow: hidden; }
        .container { background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 24px; padding: 30px; width: 100%; max-width: 450px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.5); transition: all 0.3s; position: relative; min-height: 500px; display: flex; flex-direction: column; }
        .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.05); border-radius: 3px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary-color); width: 25%; border-radius: 3px; transition: width 0.4s ease; }
        h1 { font-size: 20px; text-align: center; margin-bottom: 5px; color: #4a4a4a; margin-top: 0; }
        p.subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
        .step-content { flex: 1; display: none; animation: fadeIn 0.5s ease forwards; }
        .step-content.active { display: flex; flex-direction: column; }
        label { display: block; font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #444; line-height: 1.5; }
        input, textarea { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; background: rgba(255, 255, 255, 0.9); font-size: 15px; box-sizing: border-box; -webkit-appearance: none; }
        textarea { height: 120px; resize: none; }
        input:focus, textarea:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(125, 95, 255, 0.1); }
        .btn-group { margin-top: auto; display: flex; gap: 15px; padding-top: 20px; }
        .btn { flex: 1; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; background: var(--primary-color); color: white; box-shadow: 0 5px 15px rgba(125, 95, 255, 0.3); -webkit-tap-highlight-color: transparent; user-select: none; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: rgba(255,255,255,0.6); color: #666; border: 1px solid #ddd; box-shadow: none; }
        #result-area { display: none; text-align: center; animation: fadeIn 0.5s; }
        .guardian-img { width: 100%; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); display: block; }
        .loading-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.95); border-radius: 24px; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s; }
        /* 错误日志框，如果正常运行你不会注意到它 */
        #error-log { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #ff6b6b; font-size: 12px; padding: 10px; z-index: 10000; display: none; max-height: 100px; overflow: auto; }
    </style>
    <script>
        // 全局错误捕捉：如果代码报错，屏幕底下会出现红字
        window.onerror = function(msg, url, line) {
            const logBox = document.getElementById('error-log');
            if(logBox) {
                logBox.style.display = 'block';
                logBox.innerHTML += `错误: ${msg} (行号:${line})<br>`;
            }
            alert("程序出错了: " + msg);
        };
    </script>
</head>
<body>
    <div id="error-log"></div>
    <div class="container">
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div id="input-view" style="flex:1; display:flex; flex-direction:column;">
            <h1>🔮 心灵守护神</h1>
            <p class="subtitle">回答 4 个问题，连接你的潜意识</p>

            <div class="step-content active" id="step1">
                <label>1/4. 请描述一个最近发生的、具体的、让你情绪波动的事件？</label>
                <textarea id="q1" placeholder="例：在闹离婚..."></textarea>
                <div class="btn-group"><button class="btn" type="button" onclick="handleNext(2)">下一步</button></div>
            </div>

            <div class="step-content" id="step2">
                <label>2/4. 回到那个场景，你心里最强烈的那个感觉是什么？</label>
                <input type="text" id="q2" placeholder="例：焦虑、害怕">
                <div class="btn-group"><button class="btn btn-secondary" type="button" onclick="handlePrev(1)">上一步</button><button class="btn" type="button" onclick="handleNext(3)">下一步</button></div>
            </div>

            <div class="step-content" id="step3">
                <label>3/4. 当时你脑子里闪过的第一个念头是什么？</label>
                <input type="text" id="q3" placeholder="例：我搞不定了">
                <div class="btn-group"><button class="btn btn-secondary" type="button" onclick="handlePrev(2)">上一步</button><button class="btn" type="button" onclick="handleNext(4)">下一步</button></div>
            </div>

            <div class="step-content" id="step4">
                <label>4/4. 针对这件事情，你现在最想做的是什么？</label>
                <input type="text" id="q4" placeholder="例：找个安静的地方">
                <div class="btn-group"><button class="btn btn-secondary" type="button" onclick="handlePrev(3)">上一步</button><button class="btn" type="button" onclick="handleSubmit()">✨ 开始显化</button></div>
            </div>
        </div>

        <div class="loading-mask" id="loading-view">
            <div class="spinner"></div>
            <p style="color:#666; font-size:14px; font-weight:bold">正在连接潜意识...</p>
            <p style="color:#999; font-size:12px; margin-top:5px">AI 正在绘图，约需 30 秒</p>
        </div>

        <div id="result-area">
            <h2 style="font-size:18px; color:#4a4a4a; margin-top:10px">你的守护神已降临</h2>
            <img id="final-image" class="guardian-img" src="" alt="Guardian">
            <p style="font-size:12px; color:#888;">长按图片即可保存</p>
            <button class="btn btn-secondary" onclick="reset()">再试一次</button>
        </div>
    </div>

    <script>
        let currentStep = 1;

        function updateProgress(step) {
            document.getElementById('progress-bar').style.width = (step / 4) * 100 + '%';
        }

        function validateInput(step) {
            try {
                const el = document.getElementById('q' + step);
                if (!el) {
                    throw new Error('找不到输入框 ID: q' + step);
                }
                if (!el.value.trim()) {
                    el.classList.add('shake');
                    el.focus();
                    setTimeout(() => el.classList.remove('shake'), 300);
                    return false;
                }
                return true;
            } catch (e) {
                alert('校验出错: ' + e.message);
                return false;
            }
        }

        // 封装的下一步函数，增加错误处理
        function handleNext(targetStep) {
            try {
                // 1. 尝试校验
                if (!validateInput(currentStep)) return;

                // 2. 执行切换
                const currentEl = document.getElementById('step' + currentStep);
                const targetEl = document.getElementById('step' + targetStep);

                if (!currentEl || !targetEl) {
                    alert('页面元素缺失，请检查代码');
                    return;
                }

                currentEl.classList.remove('active');
                targetEl.classList.add('active');
                
                currentStep = targetStep;
                updateProgress(currentStep);
            } catch (error) {
                alert('跳转失败: ' + error.message);
            }
        }

        function handlePrev(targetStep) {
            try {
                document.getElementById('step' + currentStep).classList.remove('active');
                document.getElementById('step' + targetStep).classList.add('active');
                currentStep = targetStep;
                updateProgress(currentStep);
            } catch (error) {
                alert('返回失败: ' + error.message);
            }
        }

        async function handleSubmit() {
            if (!validateInput(4)) return;
            
            const q1 = document.getElementById('q1').value;
            const q2 = document.getElementById('q2').value;
            const q3 = document.getElementById('q3').value;
            const q4 = document.getElementById('q4').value;
            
            document.getElementById('loading-view').style.display = 'flex';

            try {
                const response = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Q1: q1, Q2: q2, Q3: q3, Q4: q4 })
                });

                const resJson = await response.json();
                
                if (resJson.code !== 0) throw new Error(resJson.msg || 'API 调用报错');

                // 解析逻辑
                let workflowData;
                try {
                    workflowData = JSON.parse(resJson.data);
                } catch(e) {
                    workflowData = resJson.data;
                }

                let imageUrl = '';
                if (workflowData && workflowData.output) {
                    if (typeof workflowData.output === 'string') imageUrl = workflowData.output;
                    else if (workflowData.output.url) imageUrl = workflowData.output.url;
                    else { try { imageUrl = JSON.parse(workflowData.output).url; } catch(e){} }
                }

                if (!imageUrl) throw new Error('未找到图片链接');

                const img = document.getElementById('final-image');
                img.src = imageUrl;
                img.onload = () => {
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('input-view').style.display = 'none';
                    document.querySelector('.progress-container').style.display = 'none';
                    document.getElementById('result-area').style.display = 'block';
                }

            } catch (error) {
                document.getElementById('loading-view').style.display = 'none';
                alert('出错了: ' + error.message);
            }
        }

        function reset() {
            ['q1','q2','q3','q4'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('input-view').style.display = 'flex';
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('step' + currentStep).classList.remove('active');
            document.getElementById('step1').classList.add('active');
            currentStep = 1; 
            updateProgress(1);
        }
    </script>
</body>
</html>
