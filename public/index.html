<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心灵守护神</title>

    <meta property="og:title" content="🔮 心灵守护神 | 连接你的潜意识">
    <meta name="description" content="回答4个心理问题，AI为你显化专属的心灵守护神，治愈当下的焦虑与不安。">
    <meta property="og:description" content="回答4个心理问题，AI为你显化专属的心灵守护神，治愈当下的焦虑与不安。">
    <meta property="og:image" content="https://soul.aigaoshou.com/logo.png">
    <style>
        /* 下面的样式代码保持不变，和你之前的一样 */
        :root { --primary-color: #7d5fff; --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); --glass-bg: rgba(255, 255, 255, 0.85); }
        body { font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-gradient); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; padding: 20px; color: #333; overflow: hidden; }
        
        .container { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-radius: 24px; 
            padding: 30px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            transition: all 0.3s; 
            position: relative; 
            min-height: 520px; 
            display: flex; 
            flex-direction: column; 
        }

        .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.05); border-radius: 3px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary-color); width: 25%; border-radius: 3px; transition: width 0.4s ease; }
        
        h1 { font-size: 22px; text-align: center; margin-bottom: 5px; color: #4a4a4a; margin-top: 0; letter-spacing: 1px; }
        p.subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 25px; }
        
        .step-content { flex: 1; display: none; animation: fadeIn 0.4s ease forwards; }
        .step-content.active { display: flex; flex-direction: column; }
        
        label { display: block; font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #444; line-height: 1.6; }
        
        input, textarea { 
            width: 100%; 
            padding: 16px; 
            border: 1px solid #ddd; 
            border-radius: 16px; 
            background: rgba(255, 255, 255, 0.8); 
            font-size: 16px; 
            box-sizing: border-box; 
            -webkit-appearance: none; 
            transition: all 0.3s;
        }
        
        textarea { height: 130px; resize: none; line-height: 1.5; }
        input:focus, textarea:focus { border-color: var(--primary-color); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(125, 95, 255, 0.15); }
        
        .btn-group { margin-top: auto; display: flex; gap: 15px; padding-top: 25px; }
        
        .btn { 
            flex: 1; 
            padding: 16px; 
            border-radius: 50px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            border: none; 
            transition: 0.2s; 
            background: var(--primary-color); 
            color: white; 
            box-shadow: 0 8px 20px rgba(125, 95, 255, 0.25); 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.8); color: #666; border: 1px solid #ddd; box-shadow: none; }
        
        #result-area { display: none; text-align: center; animation: fadeIn 0.5s; }
        .guardian-img { width: 100%; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); display: block; }
        
        /* Loading */
        .loading-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.98); border-radius: 24px; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { width: 44px; height: 44px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        
        /* 提示 Toast */
        .toast {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
        .shake { animation: shake 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <div id="toast" class="toast">请先填写内容哦 ✨</div>

        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>

        <div id="input-view" style="flex:1; display:flex; flex-direction:column;">
            <h1>🔮 心灵守护神</h1>
            <p class="subtitle">回答 4 个问题，连接你的潜意识</p>

            <div class="step-content active" id="step1">
                <label>1/4. 请描述一个最近发生的、具体的、让你情绪波动的事件？</label>
                <textarea id="q1" placeholder="例：因为生活琐事经常吵架，在闹离婚..."></textarea>
                <div class="btn-group">
                    <button type="button" class="btn" onclick="nextStep(2)">下一步</button>
                </div>
            </div>

            <div class="step-content" id="step2">
                <label>2/4. 回到那个场景，你心里最强烈的那个感觉是什么？</label>
                <input type="text" id="q2" placeholder="例：焦虑、害怕、无助">
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="prevStep(1)">上一步</button>
                    <button type="button" class="btn" onclick="nextStep(3)">下一步</button>
                </div>
            </div>

            <div class="step-content" id="step3">
                <label>3/4. 当时你脑子里闪过的第一个念头是什么？</label>
                <input type="text" id="q3" placeholder="例：我搞不定了，想逃避">
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="prevStep(2)">上一步</button>
                    <button type="button" class="btn" onclick="nextStep(4)">下一步</button>
                </div>
            </div>

            <div class="step-content" id="step4">
                <label>4/4. 针对这件事情，你现在最想做的是什么？</label>
                <input type="text" id="q4" placeholder="例：找个安静的地方躲起来">
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="prevStep(3)">上一步</button>
                    <button type="button" class="btn" onclick="submitFlow()">✨ 开始显化</button>
                </div>
            </div>
        </div>

        <div class="loading-mask" id="loading-view">
            <div class="spinner"></div>
            <p style="color:#666; font-size:15px; font-weight:bold">正在连接潜意识...</p>
            <p style="color:#999; font-size:12px; margin-top:8px">AI 正在绘制你的守护神<br>约需 30 秒，请保持深呼吸</p>
        </div>

        <div id="result-area">
            <h2 style="font-size:20px; color:#4a4a4a; margin-top:10px; margin-bottom:5px;">你的守护神已降临</h2>
            <p style="color:#888; font-size:13px; margin-bottom:20px;">请查收这份来自潜意识的礼物</p>
            <img id="final-image" class="guardian-img" src="" alt="Guardian">
            <p style="font-size:12px; color:#999; margin-top:15px;">长按图片即可保存到手机</p>
            <button type="button" class="btn btn-secondary" onclick="reset()" style="margin-top:20px;">再试一次</button>
        </div>
    </div>

    <script>
        let currentStep = 1;

        function updateProgress(step) {
            const bar = document.getElementById('progress-bar');
            if(bar) bar.style.width = (step / 4) * 100 + '%';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function validateInput(step) {
            const el = document.getElementById('q' + step);
            if (!el || !el.value.trim()) {
                if(el) {
                    el.classList.add('shake');
                    el.focus(); 
                    setTimeout(() => el.classList.remove('shake'), 300);
                }
                showToast('请先填写内容哦 ✨'); 
                return false;
            }
            return true;
        }

        function nextStep(targetStep) {
            if (validateInput(currentStep)) {
                document.getElementById('step' + currentStep).classList.remove('active');
                document.getElementById('step' + targetStep).classList.add('active');
                currentStep = targetStep;
                updateProgress(currentStep);
            }
        }

        function prevStep(targetStep) {
            document.getElementById('step' + currentStep).classList.remove('active');
            document.getElementById('step' + targetStep).classList.add('active');
            currentStep = targetStep;
            updateProgress(currentStep);
        }

        async function submitFlow() {
            if (!validateInput(4)) return;
            
            const q1 = document.getElementById('q1').value;
            const q2 = document.getElementById('q2').value;
            const q3 = document.getElementById('q3').value;
            const q4 = document.getElementById('q4').value;
            
            document.getElementById('loading-view').style.display = 'flex';

            try {
                const response = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Q1: q1, Q2: q2, Q3: q3, Q4: q4 })
                });

                const resJson = await response.json();
                
                if (resJson.code !== 0) throw new Error(resJson.msg || '连接不稳定');

                let workflowData;
                try {
                    workflowData = JSON.parse(resJson.data);
                } catch(e) {
                    workflowData = resJson.data;
                }

                let imageUrl = '';
                if (workflowData && workflowData.output) {
                    if (typeof workflowData.output === 'string') imageUrl = workflowData.output;
                    else if (workflowData.output.url) imageUrl = workflowData.output.url;
                    else { try { imageUrl = JSON.parse(workflowData.output).url; } catch(e){} }
                }

                if (!imageUrl) throw new Error('未能生成图片');

                const img = document.getElementById('final-image');
                img.src = imageUrl;
                img.onload = () => {
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('input-view').style.display = 'none';
                    document.querySelector('.progress-container').style.display = 'none';
                    document.getElementById('result-area').style.display = 'block';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('loading-view').style.display = 'none';
                showToast('连接拥堵，请稍后重试 🌩️');
            }
        }

        function reset() {
            ['q1','q2','q3','q4'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('input-view').style.display = 'flex';
            document.querySelector('.progress-container').style.display = 'block';
            
            document.getElementById('step' + currentStep).classList.remove('active');
            document.getElementById('step1').classList.add('active');
            currentStep = 1; 
            updateProgress(1);
        }
    </script>
</body>
</html>
